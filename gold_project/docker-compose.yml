version: '3.8'
services:
  db:
    image: postgres:14-alpine
    restart: always
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=mydb
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
  web:
    build: .
    ports:
      - '3000:3000'
    depends_on:
      - db
    environment:
      - DATABASE_URL=postgresql://user:password@db:5432/mydb?schema=public
      - NEXTAUTH_SECRET=a2c1f3b4d5e6a2c1f3b4d5e6a2c1f3b4d5e6a2c1f3b4d5e6a2c1f3b4d5e6
      - NEXTAUTH_URL=http://localhost:3000

volumes:
  postgres_data:
