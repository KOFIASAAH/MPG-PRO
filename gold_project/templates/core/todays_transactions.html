{% extends "base.html" %}

{% block content %}
<h1>Today's Transactions</h1>
<table>
    <thead>
        <tr>
            <th>Customer</th>
            <th>Weight (g)</th>
            <th>Total Amount</th>
            <th>Status</th>
        </tr>
    </thead>
    <tbody>
        {% for transaction in transactions %}
        <tr>
            <td>{{ transaction.customer.name }}</td>
            <td>{{ transaction.gold_weight }}</td>
            <td>{{ transaction.total_amount }}</td>
            <td>{{ transaction.status }}</td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
