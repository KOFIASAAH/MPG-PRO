{% extends "base.html" %}

{% block content %}
<h1>Rate History</h1>
<table>
    <thead>
        <tr>
            <th>Rate per Gram</th>
            <th>Set By</th>
            <th>Timestamp</th>
        </tr>
    </thead>
    <tbody>
        {% for rate in rates %}
        <tr>
            <td>{{ rate.rate_per_gram }}</td>
            <td>{{ rate.setter.user.username }}</td>
            <td>{{ rate.timestamp }}</td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
